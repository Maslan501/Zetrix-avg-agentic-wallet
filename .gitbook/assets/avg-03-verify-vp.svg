<text x="213.90000000000003" y="184" font-size="13" text-anchor="middle" fill="#1f2937">6. create VP (revealed</text>
<text x="213.90000000000003" y="200" font-size="13" text-anchor="middle" fill="#1f2937">claims, signed over x401</text>
<text x="213.90000000000003" y="216" font-size="13" text-anchor="middle" fill="#1f2937">challenge)</text>
