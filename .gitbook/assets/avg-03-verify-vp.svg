<text x="597.0500000000001" y="1448" font-size="13" fill="#1f2937">retry after 5 s, 30 s, 2 min, then</text>
<text x="597.0500000000001" y="1464" font-size="13" fill="#1f2937">log CALLBACK_FAILED</text>
