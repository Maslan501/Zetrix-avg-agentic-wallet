<text x="597.0500000000001" y="653" font-size="13" fill="#1f2937">sign result with service HMAC</text>
<text x="597.0500000000001" y="669" font-size="13" fill="#1f2937">secret; log attempt (no claim</text>
<text x="597.0500000000001" y="685" font-size="13" fill="#1f2937">values, 30 days)</text>
<path d="M559.0500000000001 643 h28 v54 h-24" fill="none" stroke="#1f2937" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="328.95000000000005" y="725" font-size="13" text-anchor="middle" fill="#1f2937">8a. signed result (true + disclosed claims)</text>
<line x1="559.0500000000001" y1="734" x2="101.85" y2="734" stroke="#1f2937" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="559.0500000000001" y="766" font-size="13" text-anchor="middle" fill="#1f2937">8b. forward signed result in x401 header</text>
<line x1="98.85" y1="775" x2="1016.2500000000001" y2="775" stroke="#1f2937" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="1057.25" y="811" font-size="13" fill="#1f2937">recompute HMAC with own secret;</text>
<text x="1057.25" y="827" font-size="13" fill="#1f2937">match proofRequestId</text>
<path d="M1019.2500000000001 801 h28 v38 h-24" fill="none" stroke="#1f2937" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="559.0500000000001" y="867" font-size="13" text-anchor="middle" fill="#1f2937">serve the call</text>
<line x1="1019.2500000000001" y1="876" x2="101.85" y2="876" stroke="#1f2937" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="789.1500000000001" y="908" font-size="13" text-anchor="middle" fill="#1f2937">8c. POST same signed result to callback URL (always)</text>
<line x1="559.0500000000001" y1="917" x2="1016.2500000000001" y2="917" stroke="#1f2937" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="1057.25" y="953" font-size="13" fill="#1f2937">check HMAC; treat header + callback</text>
<text x="1057.25" y="969" font-size="13" fill="#1f2937">for same proofRequestId as one</text>
<text x="1057.25" y="985" font-size="13" fill="#1f2937">result</text>
<path d="M1019.2500000000001 943 h28 v54 h-24" fill="none" stroke="#1f2937" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="328.95000000000005" y="1065" font-size="13" text-anchor="middle" fill="#1f2937">8a. signed result (false + reason code)</text>
<line x1="559.0500000000001" y1="1074" x2="101.85" y2="1074" stroke="#1f2937" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="559.0500000000001" y="1106" font-size="13" text-anchor="middle" fill="#1f2937">8b. forward</text>
<line x1="98.85" y1="1115" x2="1016.2500000000001" y2="1115" stroke="#1f2937" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="559.0500000000001" y="1147" font-size="13" text-anchor="middle" fill="#1f2937">refuse, with reason</text>
<line x1="1019.2500000000001" y1="1156" x2="101.85" y2="1156" stroke="#1f2937" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ah)"/>
