<text x="213.90000000000003" y="257" font-size="13" text-anchor="middle" fill="#1f2937">VP</text>
<line x1="328.95000000000005" y1="266" x2="101.85" y2="266" stroke="#1f2937" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="328.95000000000005" y="298" font-size="13" text-anchor="middle" fill="#1f2937">7. submit VP (OID4VP, proofRequestId)</text>
<line x1="98.85" y1="307" x2="556.0500000000001" y2="307" stroke="#1f2937" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="597.0500000000001" y="343" font-size="13" fill="#1f2937">proof request exists, not expired,</text>
<text x="597.0500000000001" y="359" font-size="13" fill="#1f2937">not used; mark used</text>
<path d="M559.0500000000001 333 h28 v38 h-24" fill="none" stroke="#1f2937" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="674.1000000000001" y="399" font-size="13" text-anchor="middle" fill="#1f2937">7a. read issuer key + VC</text>
<text x="674.1000000000001" y="415" font-size="13" text-anchor="middle" fill="#1f2937">status</text>
<line x1="559.0500000000001" y1="424" x2="786.1500000000001" y2="424" stroke="#1f2937" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="674.1000000000001" y="456" font-size="13" text-anchor="middle" fill="#1f2937">issuer key, status</text>
<line x1="789.1500000000001" y1="465" x2="562.0500000000001" y2="465" stroke="#1f2937" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="597.0500000000001" y="501" font-size="13" fill="#1f2937">check in order: (1) challenge +</text>
<text x="597.0500000000001" y="517" font-size="13" fill="#1f2937">signature (2) Zetrix issuer from AVG</text>
<text x="597.0500000000001" y="533" font-size="13" fill="#1f2937">config (3) not revoked (4) not</text>
<text x="597.0500000000001" y="549" font-size="13" fill="#1f2937">expired (5) credential type (6)</text>
<text x="597.0500000000001" y="565" font-size="13" fill="#1f2937">requested claims present</text>
<path d="M559.0500000000001 491 h28 v86 h-24" fill="none" stroke="#1f2937" stroke-width="1.4" marker-end="url(#ah)"/>
