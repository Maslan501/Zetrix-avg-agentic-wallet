<text x="548.85" y="866" font-size="13" text-anchor="middle" fill="#1f2937">CREDENTIAL_REQUIREMENT_TOO_LOW</text>
<line x1="698.85" y1="875" x2="401.85" y2="875" stroke="#1f2937" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ah)"/>
