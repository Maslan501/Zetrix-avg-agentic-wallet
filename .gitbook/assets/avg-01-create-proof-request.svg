<text x="248.85000000000002" y="184" font-size="13" text-anchor="middle" fill="#1f2937">3. call service (API / MCP / A2A)</text>
<line x1="98.85" y1="193" x2="395.85" y2="193" stroke="#1f2937" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="548.85" y="225" font-size="13" text-anchor="middle" fill="#1f2937">4. create proof request (API key,</text>
<text x="548.85" y="241" font-size="13" text-anchor="middle" fill="#1f2937">required credential, requested claims,</text>
<text x="548.85" y="257" font-size="13" text-anchor="middle" fill="#1f2937">service reference)</text>
<line x1="398.85" y1="266" x2="695.85" y2="266" stroke="#1f2937" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="736.85" y="302" font-size="13" fill="#1f2937">check API key valid, service Active,</text>
<text x="736.85" y="318" font-size="13" fill="#1f2937">rate limit (60/min), claims within</text>
<text x="736.85" y="334" font-size="13" fill="#1f2937">Allowed Claims, credential not</text>
<text x="736.85" y="350" font-size="13" fill="#1f2937">broader than onboarded</text>
<path d="M698.85 292 h28 v70 h-24" fill="none" stroke="#1f2937" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="736.85" y="394" font-size="13" fill="#1f2937">create proofRequestId + x401</text>
<text x="736.85" y="410" font-size="13" fill="#1f2937">challenge (nonce &gt;= 128-bit, 5 min,</text>
<text x="736.85" y="426" font-size="13" fill="#1f2937">single use); add service name +</text>
<text x="736.85" y="442" font-size="13" fill="#1f2937">did:zid, template IDs and issuer</text>
<text x="736.85" y="458" font-size="13" fill="#1f2937">from AVG config, verifier ID, submit</text>
<text x="736.85" y="474" font-size="13" fill="#1f2937">URL; store it</text>
